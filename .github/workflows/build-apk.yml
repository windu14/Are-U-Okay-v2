name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseParallelGC' -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure .env File
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Ensure Keystore Setup
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks || echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks || true
          else
            echo "Generating fresh release keystore (my-upload-key.jks)..."
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'areuokay123' }}" \
              -alias "${{ secrets.KEY_ALIAS || 'areuokaykey' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'areuokay123' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AreYouOkay,O=WinduLab,C=ID"
          fi

          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore fallback..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Determine Release Tag
        id: release_tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK with ProGuard
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'areuokay123' }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'areuokay123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'areuokaykey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'areuokay123' }}
          VERSION_NAME: ${{ steps.release_tag.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreYouOkay-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update Tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.release_tag.outputs.tag }}
          git push -f origin ${{ steps.release_tag.outputs.tag }} || true

      - name: Generate Release Notes Body
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          echo "## 🚀 What's New in ${{ steps.release_tag.outputs.tag }}" > release_notes.txt
          echo "" >> release_notes.txt
          echo "• **$COMMIT_TITLE**" >> release_notes.txt
          if [ -n "$COMMIT_BODY" ]; then
            echo "$COMMIT_BODY" | grep -v '^[[:space:]]*$' | sed 's/^/  • /' >> release_notes.txt
          fi
          echo "" >> release_notes.txt
          echo "### 📋 Summary" >> release_notes.txt
          echo "• Pembaruan AI Chat dengan auto-fallback Groq & Gemini API" >> release_notes.txt
          echo "• Sistem OTA Update otomatis mendeteksi rilis versi terbaru" >> release_notes.txt
          echo "• Perbaikan performa dan penandatanganan release APK" >> release_notes.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          name: Release ${{ steps.release_tag.outputs.tag }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

